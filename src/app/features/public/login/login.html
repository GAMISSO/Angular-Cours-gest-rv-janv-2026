<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card login-card shadow-sm w-100">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 mb-3"
                    style="width: 72px; height: 72px;">
                    <i class="bi bi-hospital" style="font-size: 1.8rem; color: var(--primary-color);"></i>
                </div>
                <p class="text-muted mb-1">Bienvenue sur</p>
                <h6 class="text-primary fw-semibold">Système de Gestion de Rendez-vous</h6>
                <h6 class="text-primary fw-semibold">Médicaux</h6>
            </div>

            <h4 class="text-center mb-4">Se connecter</h4>

            <form #loginForm="ngForm" (ngSubmit)="onLogin()">
                <div class="mb-3">
                    <label class="form-label">Login</label>
                    <input type="text" class="form-control" name="email" placeholder="Email ou nom d'utilisateur"
                    required
                    [(ngModel)]="userLogin.email" name="email">
                </div>

                <div class="mb-2">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" name="password" placeholder="Mot de passe" 
                    required
                    [(ngModel)]="userLogin.password" name="password">
                </div>

                <div class="text-end mb-3">
                    <a href="#" class="text-decoration-none">Mot de passe oublié?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Pas encore inscrit?</span>
                <a href="#" class="text-decoration-none ms-1">S'inscrire</a>
            </div>
        </div>
    </div>
</div>
